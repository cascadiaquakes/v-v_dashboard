name: deploy-ecs-test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "App image tag (optional; defaults to the selected commit SHA)"
        required: false

permissions:
  contents: read

concurrency:
  group: ecs-test-environment
  cancel-in-progress: false

env:
  DEPLOY_REGION: us-west-2
  PROD_STACK_NAME: DashboardStack
  DEV_STACK_NAME: DashboardEcsDev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cdk/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::818214664804:role/GitHubActionsDeployRole
          aws-region: ${{ env.DEPLOY_REGION }}
          role-session-name: gha-deploy-ecs-test

      - name: Get AWS account ID
        id: aws
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Discover production ECS infrastructure
        id: production
        shell: bash
        run: |
          set -euo pipefail
          VPC_ID=$(aws cloudformation list-stack-resources \
            --stack-name "$PROD_STACK_NAME" \
            --region "$DEPLOY_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::EC2::VPC'].PhysicalResourceId | [0]" \
            --output text)
          CLUSTER_NAME=$(aws cloudformation list-stack-resources \
            --stack-name "$PROD_STACK_NAME" \
            --region "$DEPLOY_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ECS::Cluster'].PhysicalResourceId | [0]" \
            --output text)
          read -r -a PUBLIC_SUBNET_IDS <<< "$(aws cloudformation list-stack-resources \
            --stack-name "$PROD_STACK_NAME" \
            --region "$DEPLOY_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::EC2::Subnet' && contains(LogicalResourceId, 'PublicSubnet')].PhysicalResourceId" \
            --output text)"

          if [[ -z "$VPC_ID" || "$VPC_ID" == "None" ]]; then
            echo "Could not find the production VPC in $PROD_STACK_NAME" >&2
            exit 1
          fi
          if [[ -z "$CLUSTER_NAME" || "$CLUSTER_NAME" == "None" ]]; then
            echo "Could not find the production ECS cluster in $PROD_STACK_NAME" >&2
            exit 1
          fi
          if (( ${#PUBLIC_SUBNET_IDS[@]} < 2 )); then
            echo "Could not find the production public subnets in $PROD_STACK_NAME" >&2
            exit 1
          fi

          AVAILABILITY_ZONES=()
          for SUBNET_ID in "${PUBLIC_SUBNET_IDS[@]}"; do
            AVAILABILITY_ZONES+=("$(aws ec2 describe-subnets \
              --subnet-ids "$SUBNET_ID" \
              --region "$DEPLOY_REGION" \
              --query "Subnets[0].AvailabilityZone" \
              --output text)")
          done

          PUBLIC_SUBNET_CSV=$(IFS=,; echo "${PUBLIC_SUBNET_IDS[*]}")
          AVAILABILITY_ZONE_CSV=$(IFS=,; echo "${AVAILABILITY_ZONES[*]}")

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "public_subnet_ids=$PUBLIC_SUBNET_CSV" >> "$GITHUB_OUTPUT"
          echo "availability_zones=$AVAILABILITY_ZONE_CSV" >> "$GITHUB_OUTPUT"

      - name: Ensure app ECR repository exists
        run: |
          aws ecr describe-repositories \
            --region "$DEPLOY_REGION" \
            --repository-names v-v_dashboard >/dev/null 2>&1 \
            || aws ecr create-repository \
              --region "$DEPLOY_REGION" \
              --repository-name v-v_dashboard

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$DEPLOY_REGION" \
          | docker login \
              --username AWS \
              --password-stdin \
              "${{ steps.aws.outputs.id }}.dkr.ecr.${DEPLOY_REGION}.amazonaws.com"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push test app image
        env:
          TAG: ${{ inputs.tag || github.sha }}
          REGISTRY: ${{ steps.aws.outputs.id }}.dkr.ecr.${{ env.DEPLOY_REGION }}.amazonaws.com
        run: |
          docker build -t "v-v_dashboard:$TAG" .
          docker tag "v-v_dashboard:$TAG" "$REGISTRY/v-v_dashboard:$TAG"
          docker push "$REGISTRY/v-v_dashboard:$TAG"

      - name: Deploy app-only ECS test stack
        run: |
          npx cdk@2 deploy "$DEV_STACK_NAME" \
            -c appTag="${{ inputs.tag || github.sha }}" \
            -c productionVpcId="${{ steps.production.outputs.vpc_id }}" \
            -c productionClusterName="${{ steps.production.outputs.cluster_name }}" \
            -c productionPublicSubnetIds="${{ steps.production.outputs.public_subnet_ids }}" \
            -c productionAvailabilityZones="${{ steps.production.outputs.availability_zones }}" \
            --require-approval never

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "$DEV_STACK_NAME" \
            --region "$DEPLOY_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceURL'].OutputValue" \
            --output text)
          echo "Development dashboard: http://$ALB_DNS"
          curl --fail --silent --show-error --max-time 30 "http://$ALB_DNS/" >/dev/null
          echo "Development dashboard smoke test passed."
